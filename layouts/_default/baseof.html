<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Description | default site.Params.description }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
    {{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">{{ end }}
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
      <nav aria-label="Main navigation">
        <a href="{{ "posts/" | relURL }}">Posts</a>
        <a href="{{ "about/" | relURL }}">About</a>
      </nav>
    </header>
    <main class="content">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <span>{{ site.Params.author }}</span>
      <span>Running, recorded.</span>
    </footer>
  </body>
</html>
