{{ define "main" }}
  <article>
    <header class="page-heading">
      {{ with .Date }}<time class="eyebrow" datetime="{{ .Format "2006-01-02" }}">{{ .Format "January 2, 2006" }}</time>{{ end }}
      <h1>{{ .Title }}</h1>
      {{ with .GetTerms "tags" }}
        <ul class="tag-list" aria-label="Tags">
          {{ range . }}<li>{{ .LinkTitle }}</li>{{ end }}
        </ul>
      {{ end }}
    </header>
    <div class="article-content">{{ .Content }}</div>
  </article>
{{ end }}
