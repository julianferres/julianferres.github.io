{{ define "main" }}
  <section class="intro">
    <p class="eyebrow">Training log</p>
    <h1>{{ site.Title }}</h1>
    <div class="intro-copy">{{ .Content }}</div>
  </section>
  <section aria-labelledby="latest-title" class="post-section">
    <div class="section-heading">
      <h2 id="latest-title">Latest posts</h2>
      <a href="{{ "posts/" | relURL }}">All posts <span aria-hidden="true">&rarr;</span></a>
    </div>
    <ul class="post-list">
      {{ range (where site.RegularPages "Section" "posts").ByDate.Reverse }}
        <li>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
          <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        </li>
      {{ else }}
        <li class="empty-state">No posts yet.</li>
      {{ end }}
    </ul>
  </section>
{{ end }}
